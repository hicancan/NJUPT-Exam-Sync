[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "njupt-search-tools"
version = "2.3.0"
description = "Exam and room artifact compilers for njupt-search."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4==4.12.3",
  "openpyxl==3.1.2",
  "pandas==2.2.0",
  "pydantic==2.10.0",
  "requests==2.31.0",
]

[project.optional-dependencies]
space-reconstruction = [
  "geopandas==1.1.4",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "pillow==12.3.0",
  "pyogrio==0.13.0",
  "shapely==2.1.2",
]
test = [
  "geopandas==1.1.4",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "pillow==12.3.0",
  "pyogrio==0.13.0",
  "pytest==9.0.3",
  "shapely==2.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["academics*"]
