name: CI

on:
  pull_request:
  push:
    branches: [ main, 'milestone/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/wasm/packed-impact-decoder/target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('tools/wasm/packed-impact-decoder/Cargo.lock') }}
          restore-keys: |
            rust-wasm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv sync --frozen --extra test
          npm ci

      - name: Python tests
        run: uv run python -m pytest

      - name: Source complexity gates
        run: |
          uv run python tools/quality-gates/scripts/check_source_complexity.py
          uv run python tools/quality-gates/scripts/check_tracked_byproducts.py
          uv run python tools/quality-gates/scripts/check_runtime_fast_start.py

      - name: Generated artifact gates
        run: |
          uv run python tools/quality-gates/scripts/validate_search_index.py
          uv run python tools/quality-gates/scripts/check_public_artifact_sizes.py
          uv run python -m njupt_search_eval run-smoke-queries
          uv run python -m njupt_search_eval run-task-queries

      - name: Verify WASM release artifacts
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          export PATH="/tmp/binaryen-version_129/bin:$PATH"
          wasm-opt --version
          cargo install wasm-pack --version 0.15.0 --locked
          (cd tools/wasm/packed-impact-decoder && wasm-pack build --target web --release --out-dir pkg)
          cmp tools/wasm/packed-impact-decoder/pkg/packed_impact_decoder.js apps/web/src/features/collection-search/wasm/packed_impact_decoder.js
          cmp tools/wasm/packed-impact-decoder/pkg/packed_impact_decoder.d.ts apps/web/src/features/collection-search/wasm/packed_impact_decoder.d.ts
          cmp tools/wasm/packed-impact-decoder/pkg/packed_impact_decoder_bg.wasm apps/web/src/features/collection-search/wasm/packed_impact_decoder_bg.wasm
          node tools/wasm/packed-impact-decoder/scripts/verifyWasmEquivalence.mjs
          cmp tools/wasm/packed-impact-decoder/pkg/packed_impact_decoder_bg.wasm.d.ts apps/web/src/features/collection-search/wasm/packed_impact_decoder_bg.wasm.d.ts

      - name: Frontend checks
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run check:web-bundle-size
