name: CI

on:
  pull_request:
  push:
    branches: [ main, 'milestone/**' ]
  workflow_dispatch:
    inputs:
      verification:
        description: 'Verification scope'
        required: true
        type: choice
        default: fast
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      needs_public_assets: ${{ steps.ci-mode.outputs.needs_public_assets }}
      needs_generated_assets: ${{ steps.ci-mode.outputs.needs_generated_assets }}
      needs_exam_public_assets: ${{ steps.ci-mode.outputs.needs_exam_public_assets }}
      needs_sitegraph_public_assets: ${{ steps.ci-mode.outputs.needs_sitegraph_public_assets }}
    env:
      NJUPT_SITEGRAPH_REPO: _sitegraph/njupt-site-graph
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify CI workload
        id: ci-mode
        run: |
          mode="fast"
          full_verification="false"
          needs_public_assets="true"
          needs_generated_assets="false"
          needs_exam_public_assets="false"
          needs_sitegraph_public_assets="false"
          wasm_fast_checks="false"
          exam_fast_checks="false"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.verification || 'fast' }}" = "full" ]; then
            mode="manual-full"
            full_verification="true"
            needs_generated_assets="true"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
              if [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '^(\.github/.*|tests/test_workflows\.py)$' >/dev/null; then
                mode="workflow-fast"
                full_verification="false"
                needs_public_assets="false"
                needs_generated_assets="false"
              elif [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '^(\.github/.*|tests/test_workflows\.py|apps/web/public/edgeone\.json)$' >/dev/null; then
                mode="static-public-fast"
                full_verification="false"
                needs_public_assets="true"
                needs_generated_assets="false"
              elif [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '^(tools/exam-pipeline/.*|config/classrooms/.*|apps/web/src/features/exam-schedule/.*|apps/web/src/features/room-occupancy/.*|apps/web/src/features/query-router/.*|apps/web/src/app/routing/useAppRouter\.ts|apps/web/src/app/config/constants\.ts|apps/web/src/pages/exam/.*|apps/web/src/pages/rooms/.*|apps/web/vite\.config\.ts|packages/exam-core/.*|packages/contracts/src/exam/.*|packages/contracts/tests/examDataContract\.test\.ts|tests/test_exam_.*|tests/test_prepare_public_assets_download\.py)$' >/dev/null; then
                mode="exam-code-fast"
                needs_public_assets="true"
                needs_exam_public_assets="true"
                exam_fast_checks="true"
              elif [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '^(config/data-locks/sitegraph\.lock\.json|tools/collection-indexer/.*|packages/search-core/.*|packages/contracts/src/search-index/.*|packages/contracts/src/source-sitegraph/.*|packages/contracts/tests/.*(search|sitegraph).*|tools/quality-gates/scripts/validate_search_index\.py|tools/quality-gates/scripts/check_public_artifact_sizes\.py|tests/test_sitegraph.*|tests/test_workflows\.py)$' >/dev/null; then
                mode="sitegraph-index-fast"
                needs_public_assets="true"
                needs_sitegraph_public_assets="true"
              elif [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Ev '^(tools/wasm/packed-impact-decoder/.*|apps/web/src/features/collection-search/wasm/.*)$' >/dev/null; then
                mode="wasm-fast"
                needs_public_assets="true"
                wasm_fast_checks="true"
              fi
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "full_verification=$full_verification" >> "$GITHUB_OUTPUT"
          echo "needs_public_assets=$needs_public_assets" >> "$GITHUB_OUTPUT"
          echo "needs_generated_assets=$needs_generated_assets" >> "$GITHUB_OUTPUT"
          echo "needs_exam_public_assets=$needs_exam_public_assets" >> "$GITHUB_OUTPUT"
          echo "needs_sitegraph_public_assets=$needs_sitegraph_public_assets" >> "$GITHUB_OUTPUT"
          echo "wasm_fast_checks=$wasm_fast_checks" >> "$GITHUB_OUTPUT"
          echo "exam_fast_checks=$exam_fast_checks" >> "$GITHUB_OUTPUT"
          {
            echo "### CI workload"
            echo
            echo "- Mode: \`$mode\`"
            echo "- Full verification: \`$full_verification\`"
            echo "- Public asset build: \`$needs_public_assets\`"
            echo "- Generated asset refresh: \`$needs_generated_assets\`"
            echo "- Exam public refresh: \`$needs_exam_public_assets\`"
            echo "- Sitegraph public refresh: \`$needs_sitegraph_public_assets\`"
            echo "- WASM fast checks: \`$wasm_fast_checks\`"
            echo "- Exam fast checks: \`$exam_fast_checks\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        if: steps.ci-mode.outputs.needs_public_assets == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Read data locks
        if: ${{ steps.ci-mode.outputs.needs_generated_assets == 'true' || steps.ci-mode.outputs.needs_sitegraph_public_assets == 'true' }}
        id: data-locks
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("config/data-locks/sitegraph.lock.json").read_text(encoding="utf-8"))
          print(f"sitegraph_ref={lock['sitegraph_ref']}")
          PY

      - name: Checkout sitegraph source packages
        if: ${{ steps.ci-mode.outputs.needs_generated_assets == 'true' || steps.ci-mode.outputs.needs_sitegraph_public_assets == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: hicancan/njupt-site-graph
          ref: ${{ steps.data-locks.outputs.sitegraph_ref }}
          path: _sitegraph/njupt-site-graph
          token: ${{ secrets.NJUPT_SITEGRAPH_TOKEN || github.token }}

      - name: Set up Rust
        if: ${{ steps.ci-mode.outputs.needs_generated_assets == 'true' || steps.ci-mode.outputs.wasm_fast_checks == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        if: ${{ steps.ci-mode.outputs.needs_generated_assets == 'true' || steps.ci-mode.outputs.wasm_fast_checks == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/wasm/packed-impact-decoder/target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('tools/wasm/packed-impact-decoder/Cargo.lock') }}
          restore-keys: |
            rust-wasm-${{ runner.os }}-

      - name: Install WASM tools
        if: ${{ steps.ci-mode.outputs.needs_generated_assets == 'true' || steps.ci-mode.outputs.wasm_fast_checks == 'true' }}
        run: |
          mkdir -p .ci-tools
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz \
            --output .ci-tools/binaryen-version_129-x86_64-linux.tar.gz
          tar -xzf .ci-tools/binaryen-version_129-x86_64-linux.tar.gz -C .ci-tools
          binaryen_bin="$PWD/.ci-tools/binaryen-version_129/bin"
          echo "$binaryen_bin" >> "$GITHUB_PATH"
          export PATH="$binaryen_bin:$PATH"
          cargo install wasm-pack --version 0.15.0 --locked
          wasm-pack --version
          wasm-opt --version

      - name: Initialize CI timing summary
        run: |
          {
            echo "### CI phase timings"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          start=$SECONDS
          uv sync --frozen --extra test
          if [ "${{ steps.ci-mode.outputs.needs_public_assets }}" = "true" ]; then
            npm ci
          fi
          printf '| Install dependencies | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare CI-only public assets
        if: steps.ci-mode.outputs.needs_generated_assets == 'true'
        run: |
          start=$SECONDS
          npm run prepare:public-assets
          printf '| Prepare CI-only public assets | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve latest generated data baseline
        id: generated-baseline
        if: ${{ steps.ci-mode.outputs.needs_public_assets == 'true' && steps.ci-mode.outputs.needs_generated_assets != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          artifact_name=""
          for candidate_run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .name == "njupt-search-production-dist") | .workflow_run.id'); do
            run_id="$candidate_run_id"
            artifact_name="njupt-search-production-dist"
            break
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No non-expired production dist artifact found for fast CI generated data baseline"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Restore generated data baseline
        if: ${{ steps.ci-mode.outputs.needs_public_assets == 'true' && steps.ci-mode.outputs.needs_generated_assets != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.generated-baseline.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.generated-baseline.outputs.artifact_name }}
        run: |
          start=$SECONDS
          bash .github/scripts/download-artifact-with-retry.sh "$RUN_ID" "$GITHUB_REPOSITORY" "$ARTIFACT_NAME" _baseline-dist
          rm -rf apps/web/public/generated
          cp -R _baseline-dist/generated apps/web/public/generated
          printf '| Restore generated data baseline | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize exam public assets
        if: ${{ steps.ci-mode.outputs.needs_exam_public_assets == 'true' && steps.ci-mode.outputs.needs_generated_assets != 'true' }}
        run: |
          start=$SECONDS
          uv run python tools/ci/prepare_public_assets.py build-exam-public-data
          uv run python tools/ci/prepare_public_assets.py verify-exam-public-data
          printf '| Materialize exam public assets | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize sitegraph public assets
        if: ${{ steps.ci-mode.outputs.needs_sitegraph_public_assets == 'true' && steps.ci-mode.outputs.needs_generated_assets != 'true' }}
        run: |
          start=$SECONDS
          uv run python tools/ci/prepare_public_assets.py build-sitegraph-public-data
          uv run python tools/quality-gates/scripts/validate_search_index.py
          uv run python tools/quality-gates/scripts/check_public_artifact_sizes.py
          printf '| Materialize sitegraph public assets | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify CI-only public asset determinism
        if: steps.ci-mode.outputs.needs_generated_assets == 'true'
        run: |
          start=$SECONDS
          uv run python tools/ci/prepare_public_assets.py verify-determinism
          printf '| Verify public asset determinism | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Python tests
        if: steps.ci-mode.outputs.full_verification == 'true'
        run: |
          start=$SECONDS
          uv run python -m pytest tests
          printf '| Python tests | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Exam fast checks
        if: steps.ci-mode.outputs.exam_fast_checks == 'true'
        run: |
          start=$SECONDS
          uv run python -m pytest tests/test_exam_history.py tests/test_exam_pipeline_failfast.py tests/test_exam_rooms.py tests/test_prepare_public_assets_download.py
          npm run test:prepared -- apps/web/src/features/exam-schedule apps/web/src/features/room-occupancy packages/exam-core packages/contracts/tests/examDataContract.test.ts
          npm run typecheck:prepared
          npm run lint
          printf '| Exam fast checks | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-mode workflow tests
        if: ${{ steps.ci-mode.outputs.full_verification != 'true' && steps.ci-mode.outputs.exam_fast_checks != 'true' && steps.ci-mode.outputs.needs_sitegraph_public_assets != 'true' && steps.ci-mode.outputs.wasm_fast_checks != 'true' }}
        run: |
          start=$SECONDS
          uv run python -m pytest tests/test_workflows.py
          printf '| Fast-mode workflow tests | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Fast frontend checks
        if: ${{ steps.ci-mode.outputs.needs_public_assets == 'true' && steps.ci-mode.outputs.full_verification != 'true' && steps.ci-mode.outputs.exam_fast_checks != 'true' && steps.ci-mode.outputs.needs_sitegraph_public_assets != 'true' && steps.ci-mode.outputs.wasm_fast_checks != 'true' }}
        run: |
          start=$SECONDS
          npm run test:prepared
          npm run typecheck:prepared
          npm run lint
          printf '| Fast frontend checks | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Sitegraph index fast checks
        if: ${{ steps.ci-mode.outputs.needs_sitegraph_public_assets == 'true' && steps.ci-mode.outputs.full_verification != 'true' }}
        run: |
          start=$SECONDS
          uv run python -m pytest tests/test_workflows.py tests/test_prepare_public_assets_download.py
          npm run test:prepared -- packages/search-core packages/contracts/tests/searchIndexContract.test.ts
          npm run typecheck:prepared
          npm run lint
          printf '| Sitegraph index fast checks | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: WASM fast checks
        if: ${{ steps.ci-mode.outputs.wasm_fast_checks == 'true' && steps.ci-mode.outputs.full_verification != 'true' }}
        run: |
          start=$SECONDS
          npm run build:wasm:web
          node tools/wasm/packed-impact-decoder/scripts/verifyWasmEquivalence.mjs
          npm run test:prepared -- apps/web/src/features/collection-search packages/search-core
          npm run typecheck:prepared
          npm run lint
          printf '| WASM fast checks | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Source complexity gates
        if: steps.ci-mode.outputs.full_verification == 'true'
        run: |
          start=$SECONDS
          uv run python tools/quality-gates/scripts/check_source_complexity.py
          uv run python tools/quality-gates/scripts/check_tracked_byproducts.py
          uv run python tools/quality-gates/scripts/check_runtime_fast_start.py
          printf '| Source complexity gates | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Generated artifact gates
        if: steps.ci-mode.outputs.needs_generated_assets == 'true'
        run: |
          start=$SECONDS
          uv run python tools/quality-gates/scripts/validate_search_index.py
          uv run python tools/quality-gates/scripts/check_public_artifact_sizes.py
          uv run python -m njupt_search_eval run-smoke-queries
          uv run python -m njupt_search_eval run-task-queries
          printf '| Generated artifact gates | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify WASM semantics
        if: steps.ci-mode.outputs.full_verification == 'true'
        run: |
          start=$SECONDS
          npm run build:wasm:web
          node tools/wasm/packed-impact-decoder/scripts/verifyWasmEquivalence.mjs
          printf '| Verify WASM semantics | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend checks
        if: steps.ci-mode.outputs.full_verification == 'true'
        run: |
          start=$SECONDS
          npm run test:prepared
          npm run typecheck:prepared
          npm run lint
          npm run build:prepared
          npm run check:web-bundle-size
          printf '| Frontend checks | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build deployment bundle
        if: ${{ steps.ci-mode.outputs.needs_public_assets == 'true' && steps.ci-mode.outputs.full_verification != 'true' }}
        run: |
          start=$SECONDS
          npm run build:prepared
          npm run check:web-bundle-size
          printf '| Build deployment bundle | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate CI evidence reports
        if: steps.ci-mode.outputs.full_verification == 'true'
        run: |
          start=$SECONDS
          mkdir -p tools/search-eval/reports
          uv run python -m njupt_search_eval run-cache-benchmark > tools/search-eval/reports/cache-benchmark.json
          uv run --extra browser python -m playwright install --with-deps chromium
          uv run --extra browser python -m njupt_search_eval run-browser-verification --output tools/search-eval/reports/njupt-search-browser-verification.json
          uv run python -m njupt_search_eval run-lower-bound-report --output tools/search-eval/reports/njupt-search-lower-bound-report.json --markdown tools/search-eval/reports/njupt-search-lower-bound-report.md --skip-local-body-benchmark
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("tools/search-eval/reports/njupt-search-lower-bound-report.json").read_text(encoding="utf-8"))
          rows = []
          for item in report.get("query_measurements", []):
              query = item.get("query", "")
              for phase, measurement in (item.get("phase_measurements") or {}).items():
                  rows.append((
                      int(measurement.get("uncached_loaded_bytes") or 0),
                      float(measurement.get("elapsed_ms") or 0.0),
                      int(measurement.get("network_misses") or measurement.get("artifact_misses") or 0),
                      str(phase),
                      str(query),
                  ))
          rows.sort(reverse=True)
          print("")
          print("### Slowest search evidence phases")
          print("")
          print("| Query | Phase | Uncached bytes | Artifact misses | Elapsed ms |")
          print("| --- | --- | ---: | ---: | ---: |")
          for uncached, elapsed, misses, phase, query in rows[:8]:
              print(f"| `{query}` | `{phase}` | {uncached} | {misses} | {elapsed:.3f} |")
          PY
          printf '| Generate CI evidence reports | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI evidence reports
        if: steps.ci-mode.outputs.full_verification == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: njupt-search-ci-evidence
          path: tools/search-eval/reports/

      - name: Upload deployment build artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ci-mode.outputs.needs_public_assets == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: njupt-search-dist
          path: dist/
          retention-days: 3

      - name: Upload production dist baseline
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ci-mode.outputs.needs_public_assets == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: njupt-search-production-dist
          path: dist/
          retention-days: 7

  pages-build:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.outputs.needs_public_assets == 'true' }}
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v7
        with:
          name: njupt-search-dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages-deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.outputs.needs_public_assets == 'true' }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: production-publish-main
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [ci, pages-build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000
