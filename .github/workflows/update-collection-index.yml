name: Update Collection Index

on:
  schedule:
    - cron: '30 1,7,13,19 * * *'
  repository_dispatch:
    types: [sitegraph-data-updated]
  workflow_dispatch:
    inputs:
      sitegraph_ref:
        description: 'njupt-site-graph ref to consume'
        required: false
        type: string
        default: 'main'
      force_deploy:
        description: 'Deploy the current generated data even when sitegraph.lock.json does not change.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: production-publish-main
  cancel-in-progress: false

jobs:
  update-collection-index:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      updated_ref: ${{ steps.commit.outputs.updated_ref }}
    env:
      SITEGRAPH_REF: ${{ github.event.client_payload.sitegraph_ref || github.event.inputs.sitegraph_ref || 'main' }}
      NJUPT_SITEGRAPH_REPO: _sitegraph/njupt-site-graph
      FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || (github.event.client_payload.dispatch_reason == 'manual_force' && 'true') || (github.event.client_payload.dispatch_reason == 'manual_dispatch_only' && 'true') || 'false' }}

    steps:
      - name: Checkout njupt-search
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate update trigger context
        run: |
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "sitegraph_ref=$SITEGRAPH_REF"
          echo "trigger=$GITHUB_EVENT_NAME"

      - name: Validate repository dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_SITEGRAPH_REF: ${{ github.event.client_payload.sitegraph_ref }}
          DISPATCH_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
        run: |
          if [ -z "$DISPATCH_SITEGRAPH_REF" ]; then
            echo "::error::repository_dispatch missing client_payload.sitegraph_ref"
            exit 1
          fi
          if [ "$DISPATCH_SOURCE_REPO" != "hicancan/njupt-site-graph" ]; then
            echo "::error::repository_dispatch source_repo must be hicancan/njupt-site-graph"
            exit 1
          fi
          if [ -z "$DISPATCH_SOURCE_RUN_ID" ]; then
            echo "::error::repository_dispatch missing client_payload.source_run_id"
            exit 1
          fi

      - name: Validate sitegraph ref exists
        id: sitegraph-ref
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SITEGRAPH_TOKEN || github.token }}
        run: |
          resolved_sha="$(gh api "repos/hicancan/njupt-site-graph/commits/$SITEGRAPH_REF" --jq '.sha')" || {
            echo "::error::sitegraph_ref $SITEGRAPH_REF is not a commit visible in hicancan/njupt-site-graph"
            exit 1
          }
          if [ -z "$resolved_sha" ] || [ "$resolved_sha" = "null" ]; then
            echo "::error::sitegraph_ref $SITEGRAPH_REF resolved to an empty commit"
            exit 1
          fi
          echo "resolved_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "sitegraph_ref $SITEGRAPH_REF resolved to $resolved_sha"

      - name: Plan collection update
        id: collection-plan
        run: |
          current_ref="$(python - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("config/data-locks/sitegraph.lock.json").read_text(encoding="utf-8"))["sitegraph_ref"])
          PY
          )"
          requested_ref="${{ steps.sitegraph-ref.outputs.resolved_sha }}"
          needs_data_build="true"
          if [ "$current_ref" = "$requested_ref" ]; then
            needs_data_build="false"
          fi
          should_deploy="false"
          if [ "$needs_data_build" = "true" ] || [ "$FORCE_DEPLOY" = "true" ]; then
            should_deploy="true"
          fi
          echo "current_ref=$current_ref" >> "$GITHUB_OUTPUT"
          echo "requested_ref=$requested_ref" >> "$GITHUB_OUTPUT"
          echo "needs_data_build=$needs_data_build" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          {
            echo "### Collection update plan"
            echo
            echo "- Current lock ref: \`$current_ref\`"
            echo "- Requested ref: \`$requested_ref\`"
            echo "- Needs data build: \`$needs_data_build\`"
            echo "- Force deploy: \`$FORCE_DEPLOY\`"
            echo "- Should deploy: \`$should_deploy\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout sitegraph source packages
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        uses: actions/checkout@v6
        with:
          repository: hicancan/njupt-site-graph
          ref: ${{ steps.sitegraph-ref.outputs.resolved_sha }}
          path: _sitegraph/njupt-site-graph
          token: ${{ secrets.NJUPT_SITEGRAPH_TOKEN || github.token }}

      - name: Set up Python
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        run: uv sync --frozen --extra test

      - name: Update sitegraph data lock
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        run: |
          uv run python tools/ci/prepare_public_assets.py update-sitegraph-lock --sitegraph-ref "${{ steps.sitegraph-ref.outputs.resolved_sha }}"
          uv run python tools/ci/prepare_public_assets.py build-sitegraph-public-data

      - name: Validate generated collection artifacts
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        run: |
          uv run python tools/quality-gates/scripts/check_tracked_byproducts.py
          uv run python tools/quality-gates/scripts/validate_search_index.py
          uv run python tools/quality-gates/scripts/check_public_artifact_sizes.py

      - name: Commit sitegraph lock changes
        id: commit
        if: steps.collection-plan.outputs.needs_data_build == 'true'
        run: |
          uv run python tools/ci/commit_generated_changes.py \
            --message "Auto-update sitegraph data lock" \
            --add config/data-locks/sitegraph.lock.json \
            --ref-output updated_ref

      - name: Resolve latest verified site artifact
        id: verified-dist
        if: steps.collection-plan.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          artifact_name=""
          for candidate_run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .name == "njupt-search-production-dist") | .workflow_run.id'); do
            run_id="$candidate_run_id"
            artifact_name="njupt-search-production-dist"
            break
          done
          for candidate_run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ -n "$run_id" ]; then
              break
            fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts" \
              --jq '.artifacts[] | select(.expired == false and .name == "njupt-search-dist") | .id' | grep -q .; then
              run_id="$candidate_run_id"
              artifact_name="njupt-search-dist"
              break
            fi
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No non-expired production dist or successful main CI dist artifact found for collection fast deploy"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download latest verified site artifact
        if: steps.collection-plan.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.verified-dist.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.verified-dist.outputs.artifact_name }}
        run: bash .github/scripts/download-artifact-with-retry.sh "$RUN_ID" "$GITHUB_REPOSITORY" "$ARTIFACT_NAME" dist

      - name: Overlay validated generated data into verified site artifact
        if: ${{ steps.collection-plan.outputs.should_deploy == 'true' && steps.collection-plan.outputs.needs_data_build == 'true' }}
        run: |
          test -f dist/generated/.asset-locks.json
          rm -rf dist/generated/collections/njupt-public
          mkdir -p dist/generated/collections
          cp -R apps/web/public/generated/collections/njupt-public dist/generated/collections/njupt-public
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          marker_path = Path("dist/generated/.asset-locks.json")
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          marker["sitegraph_lock_sha256"] = hashlib.sha256(Path("config/data-locks/sitegraph.lock.json").read_bytes()).hexdigest()
          marker_path.write_text(json.dumps(marker, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Setup Pages
        if: steps.collection-plan.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload collection-fast Pages artifact
        if: steps.collection-plan.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy collection-fast GitHub Pages
        if: steps.collection-plan.outputs.should_deploy == 'true'
        id: collection-fast-pages
        uses: actions/deploy-pages@v5

      - name: Set up Node for EdgeOne collection-fast deploy
        if: ${{ steps.collection-plan.outputs.should_deploy == 'true' && vars.EDGEONE_PAGES_ENABLED == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy collection-fast EdgeOne Pages
        if: ${{ steps.collection-plan.outputs.should_deploy == 'true' && vars.EDGEONE_PAGES_ENABLED == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'njupt-search' }}
          EDGEONE_PAGES_AREA: ${{ vars.EDGEONE_PAGES_AREA || 'global' }}
        run: |
          set -o pipefail
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN secret is required"
            exit 1
          fi
          project="${EDGEONE_PROJECT_NAME:-njupt-search}"
          area="${EDGEONE_PAGES_AREA:-global}"
          npx --yes edgeone@latest pages deploy ./dist -n "$project" -t "$EDGEONE_API_TOKEN" -e production -a "$area" | tee edgeone-collection-fast-deploy.log
          {
            echo "### Collection fast deploy"
            echo
            echo "- Base artifact run: \`${{ steps.verified-dist.outputs.run_id }}\`"
            echo "- Base artifact name: \`${{ steps.verified-dist.outputs.artifact_name }}\`"
            echo "- Requested ref: \`${{ steps.sitegraph-ref.outputs.resolved_sha }}\`"
            echo "- Data build used: \`${{ steps.collection-plan.outputs.needs_data_build }}\`"
            grep -E '^EDGEONE_(DEPLOY_URL|DEPLOY_TYPE|PROJECT_ID)=' edgeone-collection-fast-deploy.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Purge Cloudflare Cache
        if: ${{ steps.collection-plan.outputs.should_deploy == 'true' && vars.CF_PURGE_ENABLED == '1' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "Skip purge: CF_API_TOKEN or CF_ZONE_ID is not set."
            exit 0
          fi
          if ! curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'; then
            echo "::warning::Cloudflare cache purge failed; static site deployments already completed."
          fi

      - name: Upload production dist baseline
        if: steps.collection-plan.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: njupt-search-production-dist
          path: dist/
          retention-days: 7

      - name: Publish collection workflow summary
        if: always()
        env:
          NEEDS_DATA_BUILD: ${{ steps.collection-plan.outputs.needs_data_build || 'false' }}
          SHOULD_DEPLOY: ${{ steps.collection-plan.outputs.should_deploy || 'false' }}
          REQUESTED_REF: ${{ steps.sitegraph-ref.outputs.resolved_sha || '' }}
          UPDATED_REF: ${{ steps.commit.outputs.updated_ref || '' }}
          BASE_RUN_ID: ${{ steps.verified-dist.outputs.run_id || '' }}
          BASE_ARTIFACT_NAME: ${{ steps.verified-dist.outputs.artifact_name || '' }}
          EDGEONE_ENABLED: ${{ vars.EDGEONE_PAGES_ENABLED || 'false' }}
        run: |
          edgeone_deploy="false"
          if [ "$SHOULD_DEPLOY" = "true" ] && [ "$EDGEONE_ENABLED" = "true" ]; then
            edgeone_deploy="true"
          fi
          {
            echo "### Collection update summary"
            echo
            echo "- Lock changed: \`${{ steps.commit.outputs.changed || 'false' }}\`"
            echo "- Force deploy: \`$FORCE_DEPLOY\`"
            echo "- Data build used: \`$NEEDS_DATA_BUILD\`"
            echo "- Deployed GitHub Pages: \`$SHOULD_DEPLOY\`"
            echo "- Deployed EdgeOne: \`$edgeone_deploy\`"
            echo "- Base artifact run id: \`${BASE_RUN_ID:-none}\`"
            echo "- Base artifact name: \`${BASE_ARTIFACT_NAME:-none}\`"
            echo "- Requested lock ref: \`${REQUESTED_REF:-none}\`"
            echo "- Final lock ref: \`${UPDATED_REF:-unchanged}\`"
          } >> "$GITHUB_STEP_SUMMARY"
