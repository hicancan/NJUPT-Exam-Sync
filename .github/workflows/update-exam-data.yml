name: Build Exam Snapshot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CORPUS_URL: ${{ vars.CURRENT_CORPUS_URL }}
      CORPUS_ID: ${{ vars.CURRENT_CORPUS_ID }}
      CORPUS_SHA256: ${{ vars.CURRENT_CORPUS_SHA256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v8.2.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install production build dependencies
        run: |
          npm ci
          uv sync --frozen --extra test
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Test academics compilers
        run: |
          uv run pytest academics/exam academics/room/occupancy -q

      - name: Discover and build explicit academic artifacts
        shell: pwsh
        run: |
          uv run python -m academics.exam update-source `
            --source academics/exam/source/current.json
          ./ops/build-academics.ps1 `
            -SourcePath academics/exam/source/current.json `
            -MaterializedPath "$env:RUNNER_TEMP/exam-materialized" `
            -CachePath "$env:RUNNER_TEMP/exam-cache" `
            -ExamOutputPath "$env:RUNNER_TEMP/exam-snapshot" `
            -RoomOutputPath "$env:RUNNER_TEMP/room-occupancy" `
            -RoomCatalogPath academics/room/catalog/njupt-room-catalog.json `
            -RefreshMaterialized

      - name: Validate academics artifacts
        run: npm run academics:validate -- --exam "$RUNNER_TEMP/exam-snapshot" --room "$RUNNER_TEMP/room-occupancy"

      - name: Download the explicit current corpus
        run: |
          set -euo pipefail
          : "${CORPUS_URL:?CURRENT_CORPUS_URL repository variable is required}"
          : "${CORPUS_ID:?CURRENT_CORPUS_ID repository variable is required}"
          : "${CORPUS_SHA256:?CURRENT_CORPUS_SHA256 repository variable is required}"
          test "${#CORPUS_SHA256}" -eq 64
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/corpus.tar.zst" "$CORPUS_URL"
          printf '%s  %s\n' "$CORPUS_SHA256" "$RUNNER_TEMP/corpus.tar.zst" | sha256sum --check -
          mkdir "$RUNNER_TEMP/corpus"
          tar --zstd -xf "$RUNNER_TEMP/corpus.tar.zst" -C "$RUNNER_TEMP/corpus"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "corpus" / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("format") != "njupt-corpus-snapshot-v2":
              raise SystemExit("unsupported corpus format")
          if manifest.get("snapshot_id") != os.environ["CORPUS_ID"]:
              raise SystemExit("CURRENT_CORPUS_ID does not match manifest snapshot_id")
          PY

      - name: Reassemble the product with the new academics artifacts
        shell: pwsh
        run: |
          ./ops/build-search-bundle.ps1 `
            -CorpusPath "$env:RUNNER_TEMP/corpus" `
            -BundlePath "$env:RUNNER_TEMP/search-bundle"
          node benchmarks/search/quality.mjs `
            --bundle "$env:RUNNER_TEMP/search-bundle"
          ./ops/assemble-web.ps1 `
            -SearchBundlePath "$env:RUNNER_TEMP/search-bundle" `
            -ExamSnapshotPath "$env:RUNNER_TEMP/exam-snapshot" `
            -RoomOccupancyPath "$env:RUNNER_TEMP/room-occupancy" `
            -StagePath "$env:RUNNER_TEMP/web-stage" `
            -DistPath "$env:RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: njupt-exam-snapshot
          path: ${{ runner.temp }}/exam-snapshot
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: njupt-search-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: njupt-room-occupancy
          path: ${{ runner.temp }}/room-occupancy
          if-no-files-found: error
          retention-days: 7
