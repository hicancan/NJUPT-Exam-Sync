name: Update Exam Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy the current exam data even when exam.lock.json does not change.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: production-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-exam-data:
    runs-on: ubuntu-latest
    env:
      FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      updated_ref: ${{ steps.commit.outputs.updated_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Update exam data lock and materialize public assets
        run: |
          uv run python tools/ci/prepare_public_assets.py update-exam-lock
          uv run python tools/ci/prepare_public_assets.py build-exam-public-data

      - name: Validate generated exam public data
        run: |
          uv run python tools/quality-gates/scripts/check_tracked_byproducts.py
          uv run python tools/ci/prepare_public_assets.py verify-exam-public-data

      - name: Commit exam lock changes
        id: commit
        run: |
          uv run python tools/ci/commit_generated_changes.py \
            --message "Auto-update exam data lock" \
            --add config/data-locks/exam.lock.json \
            --ref-output updated_ref

      - name: Resolve latest verified site artifact
        id: verified-dist
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          artifact_name=""
          for candidate_run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .name == "njupt-search-production-dist") | .workflow_run.id'); do
            run_id="$candidate_run_id"
            artifact_name="njupt-search-production-dist"
            break
          done
          for candidate_run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ -n "$run_id" ]; then
              break
            fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts" \
              --jq '.artifacts[] | select(.expired == false and .name == "njupt-search-dist") | .id' | grep -q .; then
              run_id="$candidate_run_id"
              artifact_name="njupt-search-dist"
              break
            fi
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No non-expired production dist or successful main CI dist artifact found for exam fast deploy"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download latest verified site artifact
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.verified-dist.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.verified-dist.outputs.artifact_name }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist

      - name: Overlay validated exam data into verified site artifact
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        run: |
          rm -rf dist/generated/exam
          mkdir -p dist/generated
          cp -R apps/web/public/generated/exam dist/generated/exam
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          marker_path = Path("dist/generated/.asset-locks.json")
          if marker_path.exists():
              marker = json.loads(marker_path.read_text(encoding="utf-8"))
              marker["exam_lock_sha256"] = hashlib.sha256(Path("config/data-locks/exam.lock.json").read_bytes()).hexdigest()
              marker_path.write_text(json.dumps(marker, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Setup Pages
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload exam-fast Pages artifact
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy exam-fast GitHub Pages
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        id: exam-fast-pages
        uses: actions/deploy-pages@v5

      - name: Set up Node for EdgeOne exam-fast deploy
        if: ${{ (steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true') && vars.EDGEONE_PAGES_ENABLED == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy exam-fast EdgeOne Pages
        if: ${{ (steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true') && vars.EDGEONE_PAGES_ENABLED == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PAGES_PROJECT: ${{ vars.EDGEONE_PAGES_PROJECT || 'njupt-search' }}
          EDGEONE_PAGES_AREA: ${{ vars.EDGEONE_PAGES_AREA || 'overseas' }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN secret is required"
            exit 1
          fi
          project="${EDGEONE_PAGES_PROJECT:-njupt-search}"
          area="${EDGEONE_PAGES_AREA:-overseas}"
          npx --yes edgeone@latest pages deploy ./dist -n "$project" -t "$EDGEONE_API_TOKEN" -e production -a "$area" | tee edgeone-exam-fast-deploy.log
          {
            echo "### Exam fast deploy"
            echo
            echo "- Base artifact run: \`${{ steps.verified-dist.outputs.run_id }}\`"
            echo "- Base artifact name: \`${{ steps.verified-dist.outputs.artifact_name }}\`"
            echo "- Updated ref: \`${{ steps.commit.outputs.updated_ref }}\`"
            grep -E '^EDGEONE_(DEPLOY_URL|DEPLOY_TYPE|PROJECT_ID)=' edgeone-exam-fast-deploy.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production dist baseline
        if: ${{ steps.commit.outputs.changed == 'true' || env.FORCE_DEPLOY == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: njupt-search-production-dist
          path: dist/
          retention-days: 7
