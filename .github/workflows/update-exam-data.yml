name: Update Exam Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-exam-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-exam-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          uv sync --frozen --extra test
          npm ci

      - name: Update exam artifacts
        run: uv run python -m njupt_exam_pipeline run

      - name: Validate generated artifacts and app
        run: |
          uv run python -m pytest
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run check:source-complexity
          npm run check:runtime-fast-start
          npm run check:web-bundle-size
          uv run python tools/quality-gates/scripts/validate_search_index.py
          uv run python tools/quality-gates/scripts/check_public_artifact_sizes.py
          uv run python -m njupt_search_eval run-smoke-queries
          uv run python -m njupt_search_eval run-task-queries

      - name: Commit exam artifact changes
        run: |
          uv run python tools/ci/commit_generated_changes.py \
            --message "Auto-update exam data" \
            --add apps/web/public/generated/exam/
