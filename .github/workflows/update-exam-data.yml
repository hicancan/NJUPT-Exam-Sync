name: Update Exam Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-exam-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-exam-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Update exam data lock and materialize public assets
        run: |
          uv run python tools/ci/prepare_public_assets.py update-exam-lock
          uv run python tools/ci/prepare_public_assets.py build-exam-public-data

      - name: Validate generated exam public data
        run: |
          uv run python tools/quality-gates/scripts/check_tracked_byproducts.py
          uv run python tools/ci/prepare_public_assets.py verify-exam-public-data

      - name: Commit exam lock changes
        run: |
          uv run python tools/ci/commit_generated_changes.py \
            --message "Auto-update exam data lock" \
            --add config/data-locks/exam.lock.json
