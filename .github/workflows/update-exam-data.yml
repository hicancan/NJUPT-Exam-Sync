name: Build Academics Artifact

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: academics-artifact
  cancel-in-progress: false

jobs:
  build-academics:
    runs-on: ubuntu-latest
    env:
      ACADEMICS_ARTIFACT: ${{ vars.ACADEMICS_ARTIFACT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v8.2.0

      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59

      - name: Install production build dependencies
        run: |
          npm ci
          uv sync --frozen --extra test

      - name: Download and validate the current academic history head
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ACADEMICS_ARTIFACT"
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref="$(jq -er '.ref' <<< "$ACADEMICS_ARTIFACT")"
          exam_archive="$(jq -er '.exam.archive' <<< "$ACADEMICS_ARTIFACT")"
          exam_sha256="$(jq -er '.exam.sha256' <<< "$ACADEMICS_ARTIFACT")"
          history_archive="$(jq -er '.history.archive' <<< "$ACADEMICS_ARTIFACT")"
          history_sha256="$(jq -er '.history.sha256' <<< "$ACADEMICS_ARTIFACT")"
          room_archive="$(jq -er '.room.archive' <<< "$ACADEMICS_ARTIFACT")"
          room_sha256="$(jq -er '.room.sha256' <<< "$ACADEMICS_ARTIFACT")"
          [[ "$ref" == ghcr.io/*@sha256:* ]]
          [[ "$exam_archive" != */* && "$history_archive" != */* && "$room_archive" != */* ]]

          mkdir "$RUNNER_TEMP/previous-registry"
          oras pull "$ref" --output "$RUNNER_TEMP/previous-registry"
          printf '%s  %s\n' "$exam_sha256" "$RUNNER_TEMP/previous-registry/$exam_archive" | sha256sum --check -
          printf '%s  %s\n' "$history_sha256" "$RUNNER_TEMP/previous-registry/$history_archive" | sha256sum --check -
          printf '%s  %s\n' "$room_sha256" "$RUNNER_TEMP/previous-registry/$room_archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/previous-exam-snapshot" "$RUNNER_TEMP/previous-exam-history" "$RUNNER_TEMP/previous-room-occupancy"
          tar --zstd -xf "$RUNNER_TEMP/previous-registry/$exam_archive" -C "$RUNNER_TEMP/previous-exam-snapshot"
          tar --zstd -xf "$RUNNER_TEMP/previous-registry/$history_archive" -C "$RUNNER_TEMP/previous-exam-history"
          tar --zstd -xf "$RUNNER_TEMP/previous-registry/$room_archive" -C "$RUNNER_TEMP/previous-room-occupancy"
          npm run academics:validate -- \
            --exam "$RUNNER_TEMP/previous-exam-snapshot" \
            --history "$RUNNER_TEMP/previous-exam-history" \
            --room "$RUNNER_TEMP/previous-room-occupancy"

      - name: Discover and build explicit academic artifacts
        shell: pwsh
        run: |
          uv run python -m academics.exam discover `
            --output "$env:RUNNER_TEMP/exam-source.json"
          ./ops/build-academics.ps1 `
            -SourcePath "$env:RUNNER_TEMP/exam-source.json" `
            -MaterializedPath "$env:RUNNER_TEMP/exam-materialized" `
            -CachePath "$env:RUNNER_TEMP/exam-cache" `
            -ExamOutputPath "$env:RUNNER_TEMP/exam-snapshot" `
            -HistoryOutputPath "$env:RUNNER_TEMP/exam-history" `
            -RoomOutputPath "$env:RUNNER_TEMP/room-occupancy" `
            -RoomCatalogPath academics/room/catalog/njupt-room-catalog.json `
            -PreviousExamSnapshotPath "$env:RUNNER_TEMP/previous-exam-snapshot" `
            -PreviousExamHistoryPath "$env:RUNNER_TEMP/previous-exam-history" `
            -RefreshMaterialized

      - name: Validate academics artifacts
        run: npm run academics:validate -- --exam "$RUNNER_TEMP/exam-snapshot" --history "$RUNNER_TEMP/exam-history" --room "$RUNNER_TEMP/room-occupancy"

      - name: Publish academics and update the artifact pointer
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?NJUPT_SEARCH_GITHUB_TOKEN is required}"
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          exam_id="$(jq -r .snapshot_id "$RUNNER_TEMP/exam-snapshot/manifest.json")"
          history_id="$(jq -r .history_id "$RUNNER_TEMP/exam-history/manifest.json")"
          occupancy_id="$(jq -r .occupancy_id "$RUNNER_TEMP/room-occupancy/manifest.json")"
          test "${#exam_id}" -eq 64
          test "${#history_id}" -eq 64
          test "${#occupancy_id}" -eq 64
          test "$(jq -r .current_snapshot_id "$RUNNER_TEMP/exam-history/manifest.json")" = "$exam_id"
          academics_id="$(printf '%s\0%s\0%s' "$exam_id" "$history_id" "$occupancy_id" | sha256sum | cut -d' ' -f1)"
          exam_archive="njupt-exam-${exam_id}.tar.zst"
          history_archive="njupt-exam-history-${history_id}.tar.zst"
          room_archive="njupt-room-occupancy-${occupancy_id}.tar.zst"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$exam_archive" -C "$RUNNER_TEMP/exam-snapshot" .
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$history_archive" -C "$RUNNER_TEMP/exam-history" .
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$room_archive" -C "$RUNNER_TEMP/room-occupancy" .
          exam_sha256="$(sha256sum "$exam_archive" | cut -d' ' -f1)"
          history_sha256="$(sha256sum "$history_archive" | cut -d' ' -f1)"
          room_sha256="$(sha256sum "$room_archive" | cut -d' ' -f1)"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/njupt-academics"
          if digest="$(oras resolve "$registry:$academics_id" 2>/dev/null)"; then
            mkdir published
            oras pull "$registry@$digest" --output published
            printf '%s  %s\n' "$exam_sha256" "published/$exam_archive" \
              | sha256sum --check -
            printf '%s  %s\n' "$history_sha256" "published/$history_archive" \
              | sha256sum --check -
            printf '%s  %s\n' "$room_sha256" "published/$room_archive" \
              | sha256sum --check -
          else
            oras push \
              --artifact-type application/vnd.njupt.academics \
              --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$registry:$academics_id" \
              "$exam_archive:application/vnd.njupt.exam-snapshot+zstd" \
              "$history_archive:application/vnd.njupt.exam-history+zstd" \
              "$room_archive:application/vnd.njupt.room-occupancy+zstd"
            digest="$(oras resolve "$registry:$academics_id")"
          fi
          academics_artifact="$(
            jq -cn \
              --arg ref "$registry@$digest" \
              --arg id "$academics_id" \
              --arg exam_id "$exam_id" \
              --arg exam_archive "$exam_archive" \
              --arg exam_sha256 "$exam_sha256" \
              --arg history_id "$history_id" \
              --arg history_archive "$history_archive" \
              --arg history_sha256 "$history_sha256" \
              --arg room_id "$occupancy_id" \
              --arg room_archive "$room_archive" \
              --arg room_sha256 "$room_sha256" \
              '{
                ref:$ref,
                id:$id,
                exam:{id:$exam_id,archive:$exam_archive,sha256:$exam_sha256},
                history:{id:$history_id,archive:$history_archive,sha256:$history_sha256},
                room:{id:$room_id,archive:$room_archive,sha256:$room_sha256}
              }'
          )"
          gh variable set ACADEMICS_ARTIFACT --body "$academics_artifact"

      - uses: actions/upload-artifact@v7
        with:
          name: current-exam-snapshot
          path: ${{ runner.temp }}/exam-snapshot
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: current-exam-history
          path: ${{ runner.temp }}/exam-history
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: current-room-occupancy
          path: ${{ runner.temp }}/room-occupancy
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build-academics
    if: ${{ vars.SEARCH_ARTIFACT != '' }}
    runs-on: ubuntu-latest
    env:
      SEARCH_ARTIFACT: ${{ vars.SEARCH_ARTIFACT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: current-exam-snapshot
          path: ${{ runner.temp }}/exam-snapshot

      - uses: actions/download-artifact@v7
        with:
          name: current-exam-history
          path: ${{ runner.temp }}/exam-history

      - uses: actions/download-artifact@v7
        with:
          name: current-room-occupancy
          path: ${{ runner.temp }}/room-occupancy

      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Web build dependencies
        run: |
          npm ci
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Download the current SearchBundle
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref="$(jq -er '.ref' <<< "$SEARCH_ARTIFACT")"
          archive="$(jq -er '.archive' <<< "$SEARCH_ARTIFACT")"
          sha256="$(jq -er '.sha256' <<< "$SEARCH_ARTIFACT")"
          [[ "$ref" == ghcr.io/*@sha256:* ]]
          [[ "$archive" != */* ]]

          mkdir registry-download
          oras pull "$ref" --output registry-download
          printf '%s  %s\n' "$sha256" "registry-download/$archive" \
            | sha256sum --check -
          mkdir "$RUNNER_TEMP/search-bundle"
          tar --zstd -xf "registry-download/$archive" \
            -C "$RUNNER_TEMP/search-bundle"
          npm run academics:validate -- \
            --exam "$RUNNER_TEMP/exam-snapshot" \
            --history "$RUNNER_TEMP/exam-history" \
            --room "$RUNNER_TEMP/room-occupancy"

      - name: Assemble the complete Web product
        shell: pwsh
        run: |
          npm run build:wasm:web
          ./ops/assemble-web.ps1 `
            -SearchBundlePath "$env:RUNNER_TEMP/search-bundle" `
            -ExamSnapshotPath "$env:RUNNER_TEMP/exam-snapshot" `
            -ExamHistoryPath "$env:RUNNER_TEMP/exam-history" `
            -RoomOccupancyPath "$env:RUNNER_TEMP/room-occupancy" `
            -StagePath "$env:RUNNER_TEMP/web-stage" `
            -DistPath "$env:RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: njupt-search-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7
