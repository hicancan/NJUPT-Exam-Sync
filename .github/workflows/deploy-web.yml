name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_run:
    workflows: [ "Update Exam Data", "Update Collection Index" ]
    types: [ completed ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Read data locks
        id: data-locks
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("config/data-locks/sitegraph.lock.json").read_text(encoding="utf-8"))
          print(f"sitegraph_ref={lock['sitegraph_ref']}")
          PY

      - name: Checkout sitegraph source packages
        uses: actions/checkout@v6
        with:
          repository: hicancan/njupt-site-graph
          ref: ${{ steps.data-locks.outputs.sitegraph_ref }}
          path: _sitegraph/njupt-site-graph
          token: ${{ secrets.NJUPT_SITEGRAPH_TOKEN || github.token }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install WASM tools
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies 📦
        run: |
          uv sync --frozen --extra test
          npm ci

      - name: Prepare CI-only public assets
        run: npm run prepare:public-assets

      - name: Lint code 🧹
        run: npm run lint

      - name: Run tests 🧪
        run: npm test

      - name: Typecheck 🧾
        run: npm run typecheck

      - name: Build project 🏗️
        run: npm run build

      - name: Check deployment bundle size
        run: npm run check:web-bundle-size

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

