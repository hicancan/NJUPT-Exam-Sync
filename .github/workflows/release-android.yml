name: Release Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Validate release inputs
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"

          VERSION="$(jq -r .version package.json)"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::package.json version is missing"
            exit 1
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
              echo "::error::tag $RELEASE_TAG does not match package.json version v$VERSION"
              exit 1
            fi
          else
            RELEASE_TAG="v$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### Android release"
            echo
            echo "- Version: $VERSION"
            echo "- Release tag: $RELEASE_TAG"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        working-directory: apps/android
        run: chmod +x ./gradlew

      - name: Decode Keystore
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android.keystore
          test -s android.keystore

      - name: Build APK and AAB with Gradle
        working-directory: apps/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          start=$SECONDS
          ./gradlew assembleRelease bundleRelease
          printf '| Gradle release build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Rename Artifacts
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd apps/android/app/build/outputs/apk/release
          mv app-release.apk "njupt-search-${RELEASE_TAG}.apk"
          cp "njupt-search-${RELEASE_TAG}.apk" njupt-search-latest.apk

          cd ../../bundle/release
          mv app-release.aab "njupt-search-${RELEASE_TAG}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: njupt-search-android-release
          path: |
            apps/android/app/build/outputs/apk/release/njupt-search-*.apk
            apps/android/app/build/outputs/bundle/release/njupt-search-*.aab
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-apk
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: njupt-search-android-release
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
          tag_name: ${{ needs.build-apk.outputs.release_tag }}
          name: Release ${{ needs.build-apk.outputs.release_tag }}
          generate_release_notes: true

      - name: Update the stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-apk.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(find release-artifacts -type f -name njupt-search-latest.apk -print -quit)"
          test -n "$apk"
          test -s "$apk"

          current_tag="android-current"
          notes="Current signed Android build: v${VERSION}"
          if gh release view "$current_tag" >/dev/null 2>&1; then
            gh release upload "$current_tag" "$apk" --clobber
            gh release edit "$current_tag" \
              --title "Current Android release" \
              --notes "$notes" \
              --latest=false
          else
            gh release create "$current_tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "Current Android release" \
              --notes "$notes" \
              --latest=false
          fi
