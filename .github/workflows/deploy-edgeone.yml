name: Deploy EdgeOne Pages

on:
  workflow_run:
    workflows: [ 'CI' ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful CI run id to deploy. Leave empty to use the latest successful main CI run.'
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  deploy-edgeone:
    if: vars.EDGEONE_PAGES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    permissions:
      actions: read
      contents: read
    concurrency:
      group: edgeone-pages-production
      cancel-in-progress: true
    environment:
      name: edgeone-pages
    runs-on: ubuntu-latest
    steps:
      - name: Resolve verified CI artifact run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event.inputs.run_id || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$WORKFLOW_RUN_SHA" != "$latest_sha" ]; then
              echo "workflow_run SHA $WORKFLOW_RUN_SHA is not current main $latest_sha; skipping stale EdgeOne deploy."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id="$WORKFLOW_RUN_ID"
          elif [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful main CI run found for EdgeOne deployment"
            exit 1
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified build artifact
        if: steps.resolve.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name njupt-search-dist --dir dist

      - name: Set up Node
        if: steps.resolve.outputs.should_deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy to EdgeOne Pages
        if: steps.resolve.outputs.should_deploy == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PAGES_PROJECT: ${{ vars.EDGEONE_PAGES_PROJECT || 'njupt-search' }}
          EDGEONE_PAGES_AREA: ${{ vars.EDGEONE_PAGES_AREA || 'overseas' }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN secret is required"
            exit 1
          fi
          project="${EDGEONE_PAGES_PROJECT:-njupt-search}"
          area="${EDGEONE_PAGES_AREA:-overseas}"
          echo "Deploying verified CI artifact to EdgeOne Pages project '$project' in area '$area'."
          npx --yes edgeone@latest pages deploy ./dist -n "$project" -t "$EDGEONE_API_TOKEN" -e production -a "$area" | tee edgeone-deploy.log
          {
            echo "### EdgeOne Pages deployment"
            echo
            echo "- CI run: \`${{ steps.resolve.outputs.run_id }}\`"
            echo "- Project: \`$project\`"
            echo "- Area: \`$area\`"
            grep -E '^EDGEONE_(DEPLOY_URL|DEPLOY_TYPE|PROJECT_ID)=' edgeone-deploy.log || true
          } >> "$GITHUB_STEP_SUMMARY"
