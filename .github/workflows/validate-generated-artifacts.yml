name: Validate Generated Artifacts

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'apps/web/public/generated/**'
      - 'tools/**'
      - 'packages/contracts/**'
      - '.github/workflows/validate-generated-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install Python tools
        run: uv sync --frozen --extra test

      - name: Validate generated artifacts
        run: |
          uv run python tools/quality-gates/scripts/validate_search_index.py
          uv run python tools/quality-gates/scripts/check_public_artifact_sizes.py
          uv run python -m njupt_search_eval run-smoke-queries
          uv run python -m njupt_search_eval run-task-queries
