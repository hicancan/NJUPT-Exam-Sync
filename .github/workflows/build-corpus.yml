name: Build Corpus Artifact

on:
  repository_dispatch:
    types: [njupt-corpus-published]
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: Digest-addressed NjuptCorpusSnapshot OCI artifact; empty uses the current repository pointer
        required: false
        type: string
      corpus_id:
        description: NjuptCorpusSnapshot content identity; empty uses the current repository pointer
        required: false
        type: string
      corpus_archive:
        description: Corpus archive filename; empty uses the current repository pointer
        required: false
        type: string
      corpus_sha256:
        description: SHA-256 of the corpus archive; empty uses the current repository pointer
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: corpus-artifact
  cancel-in-progress: true

jobs:
  build-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59

      - name: Resolve one explicit corpus artifact
        env:
          INPUT_CORPUS_REF: ${{ github.event.client_payload.corpus_ref || inputs.corpus_ref }}
          INPUT_CORPUS_ID: ${{ github.event.client_payload.corpus_id || inputs.corpus_id }}
          INPUT_CORPUS_ARCHIVE: ${{ github.event.client_payload.corpus_archive || inputs.corpus_archive }}
          INPUT_CORPUS_SHA256: ${{ github.event.client_payload.corpus_sha256 || inputs.corpus_sha256 }}
          CURRENT_ARTIFACT: ${{ vars.CURRENT_CORPUS_ARTIFACT }}
        run: |
          set -euo pipefail
          corpus_ref="$INPUT_CORPUS_REF"
          corpus_id="$INPUT_CORPUS_ID"
          corpus_archive="$INPUT_CORPUS_ARCHIVE"
          corpus_sha256="$INPUT_CORPUS_SHA256"
          if [ -z "$corpus_ref" ]; then
            : "${CURRENT_ARTIFACT:?corpus_ref or CURRENT_CORPUS_ARTIFACT is required}"
            corpus_ref="$(jq -er '.ref' <<< "$CURRENT_ARTIFACT")"
            corpus_id="$(jq -er '.id' <<< "$CURRENT_ARTIFACT")"
            corpus_archive="$(jq -er '.archive' <<< "$CURRENT_ARTIFACT")"
            corpus_sha256="$(jq -er '.sha256' <<< "$CURRENT_ARTIFACT")"
          fi
          : "${corpus_id:?corpus_id is required}"
          : "${corpus_archive:?corpus_archive is required}"
          : "${corpus_sha256:?corpus_sha256 is required}"
          [[ "$corpus_ref" == ghcr.io/*@sha256:* ]]
          [[ "$corpus_archive" != */* ]]
          test "${#corpus_id}" -eq 64
          test "${#corpus_sha256}" -eq 64
          {
            echo "CORPUS_REF=$corpus_ref"
            echo "CORPUS_ID=$corpus_id"
            echo "CORPUS_ARCHIVE=$corpus_archive"
            echo "CORPUS_SHA256=$corpus_sha256"
          } >> "$GITHUB_ENV"

      - name: Download and validate the corpus
        run: |
          set -euo pipefail
          mkdir registry-download
          oras pull "$CORPUS_REF" --output registry-download
          test -f "registry-download/$CORPUS_ARCHIVE"
          printf '%s  %s\n' "$CORPUS_SHA256" "registry-download/$CORPUS_ARCHIVE" \
            | sha256sum --check -
          mkdir corpus
          tar --zstd -xf "registry-download/$CORPUS_ARCHIVE" -C corpus
          test "$(jq -r .snapshot_id corpus/manifest.json)" = "$CORPUS_ID"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: npm ci

      - name: Compile and measure SearchBundle
        shell: pwsh
        run: |
          ./ops/build-search-bundle.ps1 `
            -CorpusPath corpus `
            -BundlePath "$env:RUNNER_TEMP/search-bundle"
          node benchmarks/search/quality.mjs `
            --bundle "$env:RUNNER_TEMP/search-bundle"

      - name: Publish SearchBundle and update artifact pointers
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?NJUPT_SEARCH_GITHUB_TOKEN is required}"
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          bundle_id="$(jq -r .bundle_id "$RUNNER_TEMP/search-bundle/manifest.json")"
          test "${#bundle_id}" -eq 64
          archive="njupt-search-bundle-${bundle_id}.tar.zst"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$archive" -C "$RUNNER_TEMP/search-bundle" .
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/njupt-search-bundle"
          oras push \
            --artifact-type application/vnd.njupt.search-bundle \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "$registry:$bundle_id,current" \
            "$archive:application/vnd.njupt.search-bundle+zstd"
          digest="$(oras resolve "$registry:$bundle_id")"
          test "$(oras resolve "$registry:current")" = "$digest"
          bundle_ref="$registry@$digest"

          corpus_artifact="$(
            jq -cn \
              --arg ref "$CORPUS_REF" \
              --arg id "$CORPUS_ID" \
              --arg archive "$CORPUS_ARCHIVE" \
              --arg sha256 "$CORPUS_SHA256" \
              '{ref:$ref,id:$id,archive:$archive,sha256:$sha256}'
          )"
          search_artifact="$(
            jq -cn \
              --arg ref "$bundle_ref" \
              --arg id "$bundle_id" \
              --arg archive "$archive" \
              --arg sha256 "$archive_sha256" \
              '{ref:$ref,id:$id,archive:$archive,sha256:$sha256}'
          )"
          gh variable set CURRENT_CORPUS_ARTIFACT --body "$corpus_artifact"
          gh variable set SEARCH_ARTIFACT --body "$search_artifact"

      - uses: actions/upload-artifact@v7
        with:
          name: current-search-bundle
          path: ${{ runner.temp }}/search-bundle
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build-search
    if: ${{ vars.ACADEMICS_ARTIFACT != '' }}
    runs-on: ubuntu-latest
    env:
      ACADEMICS_ARTIFACT: ${{ vars.ACADEMICS_ARTIFACT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: current-search-bundle
          path: ${{ runner.temp }}/search-bundle

      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Web build dependencies
        run: |
          npm ci
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Download and validate current academic artifacts
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref="$(jq -er '.ref' <<< "$ACADEMICS_ARTIFACT")"
          exam_archive="$(jq -er '.exam.archive' <<< "$ACADEMICS_ARTIFACT")"
          exam_sha256="$(jq -er '.exam.sha256' <<< "$ACADEMICS_ARTIFACT")"
          room_archive="$(jq -er '.room.archive' <<< "$ACADEMICS_ARTIFACT")"
          room_sha256="$(jq -er '.room.sha256' <<< "$ACADEMICS_ARTIFACT")"
          [[ "$ref" == ghcr.io/*@sha256:* ]]
          [[ "$exam_archive" != */* ]]
          [[ "$room_archive" != */* ]]

          mkdir registry-download
          oras pull "$ref" --output registry-download
          printf '%s  %s\n' "$exam_sha256" "registry-download/$exam_archive" \
            | sha256sum --check -
          printf '%s  %s\n' "$room_sha256" "registry-download/$room_archive" \
            | sha256sum --check -
          mkdir exam-snapshot room-occupancy
          tar --zstd -xf "registry-download/$exam_archive" -C exam-snapshot
          tar --zstd -xf "registry-download/$room_archive" -C room-occupancy
          npm run academics:validate -- --exam exam-snapshot --room room-occupancy

      - name: Assemble the complete Web product
        shell: pwsh
        run: |
          npm run build:wasm:web
          ./ops/assemble-web.ps1 `
            -SearchBundlePath "$env:RUNNER_TEMP/search-bundle" `
            -ExamSnapshotPath exam-snapshot `
            -RoomOccupancyPath room-occupancy `
            -StagePath "$env:RUNNER_TEMP/web-stage" `
            -DistPath "$env:RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: njupt-search-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7
