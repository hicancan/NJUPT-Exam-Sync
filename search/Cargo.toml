[workspace]
members = ["core", "native", "wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
ruzstd = "0.9"
wasm-bindgen = "=0.2.122"
zstd = "0.13"
